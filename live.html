<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaloTV Live</title>

<link rel="stylesheet" href="live.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#d60000">

<link rel="icon" href="images/balotv-logo-1.png">

</head>

<body>

<!-- HEADER -->

<!-- TOPBAR -->

<header class="topbar">

  <!-- MENU BUTTON -->

  <div
    class="menu-btn"
    onclick="toggleMenu()"
  >

    <span></span>
    <span></span>
    <span></span>

  </div>

  <!-- DROPDOWN -->

  <div
    class="dropdown-menu"
    id="dropdownMenu"
  >

    <a href="index.html">
      Home
    </a>

    <a href="about.html">
      Submit Content
    </a>

    <a href="terms.html">
      Terms
    </a>

  </div>

  <!-- LOGO -->

  <div class="logo">

    <img
      src="images/balotv-logo.png"
      alt="BaloTV"
    >

  </div>



</header>



<!-- LIVE PLAYER -->

<section class="player-section">

    <h2 class="section-title">

        🔴 LIVE NOW

    </h2>

    <div class="player-wrapper">

        <iframe

            id="livePlayer"

            src=""

            allowfullscreen

            allow="autoplay; encrypted-media"

        ></iframe>




        <button id="fullscreenBtn" class="fullscreen-btn">
          ⛶
      </button>
      
      <iframe id="livePlayer"></iframe>



      

    </div>

</section>

<!-- OFF AIR -->

<section id="offlineScreen">

    <div class="offline-box">

        <h2>

            📺 CURRENTLY OFF AIR

        </h2>

        <p>

            There is no live broadcast at the moment.

        </p>

        <p>

            Please check back later.

        </p>

    </div>

</section>

<section class="schedule">

  <h2 class="section-title">
  
  Today's Programming
  
  </h2>
  
  <div class="schedule-card">
  
  <div class="programme">
  
  <span class="time">08:00</span>
  
  <div>
  
  <h3>Morning News</h3>
  
  <p>Headlines from South Africa</p>
  
  </div>
  
  </div>
  
  <div class="programme current">
  
  <span class="time">18:00</span>
  
  <div>
  
  <h3>🔴 LIVE Broadcast</h3>
  
  <p>Election Coverage</p>
  
  </div>
  
  </div>
  
  <div class="programme">
  
  <span class="time">20:00</span>
  
  <div>
  
  <h3>Entertainment</h3>
  
  <p>Music & Community</p>
  
  </div>
  
  </div>
  
  </div>
  
  </section>


  <!-- MOBILE NAV -->

  <div class="mobile-nav">

    <button
      class="mobile-nav-btn active"
      onclick="window.location.href='index.html'"
    >
      Home
    </button>



    <button
      class="mobile-nav-btn"
      onclick="window.location.href='blog.html'"
    >
      Live
    </button>

  </div>




<script src="live.js"></script>

</body>
</html>
