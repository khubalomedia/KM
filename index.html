<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>BaloTV</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

  <link
    rel="manifest"
    href="manifest.json"
  />

  <meta
    name="theme-color"
    content="#ff1a1a"
  />

  <link rel="icon" href="images/balotv-logo-1.png">
  

</head>

<body>

  <!-- TOPBAR -->

  <header class="topbar">

    <!-- MENU BUTTON -->

    <div
      class="menu-btn"
      onclick="toggleMenu()"
    >

      <span></span>
      <span></span>
      <span></span>

    </div>

    <!-- DROPDOWN -->

    <div
      class="dropdown-menu"
      id="dropdownMenu"
    >

      <a href="index.html">
        Home
      </a>

      <a href="about.html">
        Submit Content
      </a>

      <a href="terms.html">
        Terms
      </a>

    </div>

    <!-- LOGO -->

    <div class="logo">

      <img
        src="images/balotv-logo.png"
        alt="BaloTV"
      >

    </div>

    <!-- SEARCH -->

    <div class="top-right">

      <input
        type="text"
        placeholder="Search..."
        id="searchInput"
      />

    </div>

  </header>

  <!-- LAYOUT -->

  <div class="layout">

    <!-- MAIN CONTENT -->

    <main class="content library-page">

      <!-- PLAYER -->

      <section
        class="player-section hidden"
        id="playerSection"
      >

        <iframe
          id="video-player"
          src=""
          allowfullscreen
          allow="autoplay"
        ></iframe>

        <!-- CONTROLS -->

        <div class="player-controls">

          <button
            id="prevBtn"
            class="control-btn"
          >

            <span>⏮</span>

            Previous

          </button>

          <button
            id="nextBtn"
            class="control-btn next"
          >

            Next

            <span>⏭</span>

          </button>

        </div>



       
        

        



        <div class="up-next-player">

          <div class="up-next-header">
              ▶ Up Next
          </div>
      
          <h2 class="up-next-title">More From This Category</h2>
  
          <div id="playerQueue" class="up-next-list"></div>
      
      </div>


      </section>






      <!-- LIBRARY -->

      <div class="library-page">

        
       
<!-- Recommended -->
<section class="section">

  <h2>Recommended</h2>



  <div
    id="row-recommended"
    class="video-row"
  ></div>

</section>


<!-- From TikTok To Fame -->
<section class="section">

  <h2>From TikTok To Fame</h2>



  <div
    id="row-fttf"
    class="video-row"
  ></div>

</section>



<!-- EDUCATIONAL -->
<section class="section">

  <h2>Educational</h2>



  <div
    id="row-educational"
    class="video-row"
  ></div>

</section>


<!-- TALK SHOWS -->
<section class="section">

  <h2>Talk Shows</h2>



  <div
    id="row-talk"
    class="video-row"
  ></div>

</section>


<!-- CARTOONS -->
<section class="section">

  <h2>Cartoons</h2>



  <div
    id="row-cartoons"
    class="video-row"
  ></div>

</section>


<!-- TRAILERS -->
<section class="section">

  <h2>Iskhathi Sesphithisphithi KwaMthembu</h2>



  <div
    id="row-IskhathiSesphithisphithiKwaMthembu"
    class="video-row"
  ></div>


  <!-- Shorts -->
<section class="section">

  <h2>Shorts</h2>



  <div
    id="row-Shorts"
    class="video-row"
  ></div>

</section>


      </div>

    </main>

  </div>



  <!-- MOBILE NAV -->

  <div class="mobile-nav">

    <button
      class="mobile-nav-btn active"
      onclick="window.location.href='index.html'"
    >
      Home
    </button>

    <button
      class="mobile-nav-btn"
      onclick="window.location.href='live.html'"
    >
      Live
    </button>

  </div>

  <!-- JS -->

  <script src="https://www.youtube.com/iframe_api"></script>

<script src="app.js"></script>

  <script>

    function toggleMenu() {

      document
        .getElementById("dropdownMenu")
        .classList
        .toggle("active");

    }

    if ("serviceWorker" in navigator) {

      navigator
        .serviceWorker
        .register("/service-worker.js");

    }

  </script>

</body>

</html>
