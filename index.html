<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BaloTV</title>

<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">

</head>

<body>

<header class="topbar">

  

  <div class="logo">
    <img src="balotv-logo.png" alt="BaloTV">
 </div>

  <div class="top-right">
    <input type="text" placeholder="Search..." id="searchInput">
  </div>

  <div class="hero-buttons">
  <a href="about.html">Why BaloTV</a>
</div>



</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Categories</h3>

    <button class="category-btn active" data-category="home">
      Home
    </button>

    <button class="category-btn" data-category="talk">
      Talk Shows
    </button>

    <button class="category-btn" data-category="cartoons">
      Cartoons
    </button>

    <button class="category-btn" data-category="musicvideos">
      Music Videos
    </button>

  </aside>

  <!-- MAIN -->
  <main class="content">

    <!-- PLAYER -->
    <section id="player-section">
      <iframe
        id="video-player"
        src=""
        allowfullscreen
        allow="autoplay"
      ></iframe>

<!-- VIDEO INFO -->
<div class="video-info">


  <div class="continue-box">

    <h3>Continue Watching</h3>
    
    <div id="row-continue"
    class="video-grid"></div>
    
    </div>


  <h1 id="video-title">Select a video</h1>
  <p id="video-description">
    Video description will appear here.
  </p>
</div>

    </section>



    <!-- HOME -->
    <section class="section category-section" id="section-home">
      <h2>Home Videos</h2>
      <div id="row-home" class="video-grid"></div>
    </section>

    <!-- TALK -->
    <section class="section category-section hidden" id="section-talk">
      <h2>Talk Shows</h2>
      <div id="row-talk" class="video-grid"></div>
    </section>

    <!-- CARTOONS -->
    <section class="section category-section hidden" id="section-cartoons">
      <h2>Cartoons</h2>
      <div id="row-cartoons" class="video-grid"></div>
    </section>

    <!-- MUSIC VIDEOS -->
    <section class="section category-section hidden" id="section-musicvideos">
      <h2>Music Videos</h2>
      <div id="row-musicvideos" class="video-grid"></div>
    </section>






    
  </main>

</div>



<script>



</script>





<script src="app.js"></script>

</body>
</html>
